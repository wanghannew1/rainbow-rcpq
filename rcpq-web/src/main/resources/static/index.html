<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>彩虹人才管理系统 · 业务员工作台</title>
<link rel="icon" href="/icon/jlrc.ico">
<link rel="stylesheet" href="/vendor/element-plus.css">
<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/element-plus.full.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/pages/calc.js"></script>
<script src="/js/pages/hire.js"></script>
<script src="/js/pages/audit.js"></script>
<script src="/js/pages/salary.js"></script>
<script src="/js/pages/money.js"></script>
<script src="/js/pages/social.js"></script>
<script src="/js/pages/hz.js"></script>
<script src="/js/pages/yue.js"></script>
<script src="/js/pages/jishu.js"></script>
<script src="/js/pages/change.js"></script>
<style>
  body { margin: 0; background: #f5f7fa; font-family: system-ui, "Microsoft YaHei", sans-serif; }
  .brand { color: #fff; padding: 18px 16px 10px; }
  .brand b { font-size: 16px; }
  .brand span { display: block; font-size: 12px; opacity: .75; margin-top: 4px; }
  .page { padding: 4px 8px 24px; }
  .kv { color: #909399; font-size: 12px; margin-top: 4px; word-break: break-all; }
  .bad { color: #f56c6c; font-weight: 600; margin: 8px 0; }
  pre.log { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px;
            font-size: 12px; max-height: 260px; overflow: auto; white-space: pre-wrap; }
  h4 { margin: 18px 0 8px; }
  .el-menu { border-right: none; }
</style>
</head>
<body>
<div id="app">
  <el-container style="min-height:100vh">
    <el-aside width="215px" style="background:#2c3e50">
      <div class="brand"><b>彩虹人才管理系统</b><span>业务员工作台 · 按月度节拍办理</span></div>
      <el-menu :default-active="tab" background-color="#2c3e50" text-color="#bfcbd9"
               active-text-color="#409EFF" @select="k => tab = k">
        <template v-for="g in menu" :key="g.group">
          <el-menu-item-group :title="g.group">
            <el-menu-item v-for="it in g.items" :key="it.key" :index="it.key" :disabled="!!it.disabled">
              {{ it.label }}<span v-if="it.disabled" style="opacity:.5"> (建设中)</span>
            </el-menu-item>
          </el-menu-item-group>
        </template>
      </el-menu>
    </el-aside>
    <el-container>
      <el-header style="background:#fff;border-bottom:1px solid #e4e7ed;display:flex;align-items:center;justify-content:space-between">
        <b style="font-size:15px">{{ (menu.flatMap(g => g.items).find(i => i.key === tab) || {}).label || '' }}</b>
        <span style="font-size:13px;color:#606266">经办人
          <el-select v-model="store.oper" value-key="aae011" size="small" style="width:220px">
            <el-option v-for="o in store.opers" :key="o.aae011" :value="o"
                       :label="o.aae011 + ' ' + (o.aae019 || '')"/>
          </el-select>
        </span>
      </el-header>
      <el-main><component :is="current"/></el-main>
    </el-container>
  </el-container>
</div>

<script>
(() => {
  const { createApp, ref, computed, onMounted } = Vue;
  const MENU = [
    { group: "月初 · 增员", items: [
      { key: "hire", label: "新签导入" },
      { key: "audit", label: "新签审核台" },
    ]},
    { group: "每月中 · 五险一金", items: [
      { key: "social", label: "社保 / 医保报盘" },
      { key: "hz", label: "社保报增回盘" },
      { key: "yue", label: "月转款对账" },
      { key: "jishu", label: "基数申报(年度)" },
    ]},
    { group: "固定日 · 工资险金", items: [
      { key: "salary", label: "工资核对" },
      { key: "calc", label: "险金测算" },
    ]},
    { group: "月末 · 收款开票", items: [
      { key: "money", label: "到账 / 发票" },
    ]},
    { group: "变更 · 退出", items: [
      { key: "change", label: "续签 / 终止" },
    ]},
  ];
  const app = createApp({
    setup() {
      const tab = ref("hire");
      const current = computed(() => WB.pages[tab.value] || WB.pages.hire);
      const store = WB.api.store;
      onMounted(() => WB.api.loadOpers());
      return { tab, current, menu: MENU, store };
    },
  });
  app.use(ElementPlus);
  app.component("wb-contract-pick", WB.ui.contractPick);
  app.component("wb-dsf-tip", WB.ui.dsfTip);
  app.mount("#app");
})();
</script>
</body>
</html>
