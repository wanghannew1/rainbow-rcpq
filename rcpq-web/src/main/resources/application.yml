spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rainbow_rcpq
    username: rcpq
    password: rcpq_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none   # DDL 由 db/V1-V3 迁移脚本管理, 禁止 Hibernate 自动建表
    open-in-view: false
  jackson:
    time-zone: Asia/Shanghai   # 时间序列化按东八区(库里存北京墙钟, 默认 UTC 会错标成 +00:00)
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true   # 静态资源协商缓存(304), 防 jar 更新后浏览器吃旧 JS
server:
  port: 8080
